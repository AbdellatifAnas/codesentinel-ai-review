server:
  port: 8080

spring:
  application:
    name: ai-code-review
  # Default local profile uses H2 in-memory DB so IntelliJ runs immediately with zero setup
  datasource:
    url: jdbc:h2:mem:codereview_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  gemini:
    api-key: ${GEMINI_API_KEY:demo-mode}
    model: gemini-2.5-flash
  github:
    token: ${GITHUB_TOKEN:optional-github-pat-token}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:my-webhook-secret}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/codereview_db?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
